# hunkboard — example nginx site, mounted under a URL prefix
#
# Serves the shared viewer plus one directory per namespace under /hunkboard/,
# and accepts the viewer's PUT of comments.json. Requires ngx_http_dav_module
# (check with `nginx -V 2>&1 | grep -o http_dav_module`; the official Docker
# images have it). Replace the placeholders.
#
# On disk (root is /srv, so the URL prefix /hunkboard/ maps to /srv/hunkboard/):
#   /srv/hunkboard/viewer.html                       one shared viewer
#   /srv/hunkboard/<repo>/<branch>/diff.json         written by hunkboard-publish + push
#   /srv/hunkboard/<repo>/<branch>/comments.json     written ONLY by the viewer (PUT)
#   /srv/hunkboard/<repo>/<branch>/resolutions.json  written ONLY by the agent + push
#
# /srv/hunkboard must be writable by the nginx worker user for PUT to work. If the
# directory is owned by your shell user, a default ACL does it without sudo:
#   setfacl -m u:101:rwx -m d:u:101:rwx /srv/hunkboard     (101 = nginx in the official image)
# Push with:  hunkboard-push --remote <host> --root /srv/hunkboard ...
# Open:       https://review.example.com/hunkboard/<repo>/<branch>/
#
# To serve at the site root instead, set `root /srv/hunkboard;` and drop the
# /hunkboard prefix from every location below.

server {
    listen 443 ssl;
    server_name review.example.com;

    ssl_certificate     /etc/letsencrypt/live/review.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/review.example.com/privkey.pem;

    root /srv;

    # Nothing lives outside the prefix on this listener.
    location = / { return 404; }

    location /hunkboard/ {
        # Never expose the board without authentication: it contains your source.
        auth_basic           "hunkboard";
        auth_basic_user_file /etc/nginx/hunkboard.htpasswd;

        # The only writable path: <namespace>/comments.json, via PUT. This rule must
        # come before the generic .json rule (regex locations match in order), and
        # it has no try_files, or the very first PUT that creates the file gets 404.
        location ~ ^/hunkboard/[^/]+/[^/]+/comments\.json$ {
            add_header Cache-Control "no-store";
            limit_except GET HEAD PUT { deny all; }
            dav_methods PUT;
            dav_access user:rw group:rw all:r;
            create_full_put_path on;
            client_max_body_size 2m;
        }

        # Data files change every round; make sure phones do not cache them.
        location ~ ^/hunkboard/.*\.json$ {
            add_header Cache-Control "no-store";
            try_files $uri =404;
        }

        # /hunkboard/<repo>/<branch>/ opens the shared viewer for that namespace.
        location ~ ^/hunkboard/[^/]+/[^/]+/$ {
            try_files /hunkboard/viewer.html =404;
        }

        try_files $uri $uri/ =404;
    }
}
